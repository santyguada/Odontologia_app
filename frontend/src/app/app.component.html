      <nav class="barra-usuario">
        <a routerLink="/admin">Agenda</a>
        <span class="nombre-usuario">{{ usuario.nombre }} ({{ usuario.rol }})</span>
        <button type="button" class="boton boton-secundario boton-chico" (click)="cerrarSesion()">
          Cerrar sesión
        </button>
      </nav>
    }
  </div>
