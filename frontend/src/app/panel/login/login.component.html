<form class="tarjeta login" [formGroup]="form" (ngSubmit)="ingresar()">
  <h1>Acceso personal</h1>

  <div class="campo">
    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="username" />
    @if (form.controls.email.invalid && form.controls.email.touched) {
      <span class="ayuda-error">Ingresá un email válido.</span>
    }
  </div>

  <div class="campo">
    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    @if (form.controls.password.invalid && form.controls.password.touched) {
      <span class="ayuda-error">La contraseña es obligatoria.</span>
    }
  </div>

  <button type="submit" class="boton" [disabled]="form.invalid || enviando()">
    {{ enviando() ? 'Ingresando...' : 'Ingresar' }}
  </button>

  @if (error()) {
    <p class="mensaje-error">{{ error() }}</p>
  }
</form>
